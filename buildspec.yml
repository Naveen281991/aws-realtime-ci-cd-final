# buildspec.yml

version: 0.2

env:
  variables:
    ECR_REPOSITORY: "aws-enterprise-cicd-app"
    CONTAINER_NAME: "aws-enterprise-cicd-app"

    # CI-only PostgreSQL configuration.
    POSTGRES_DB: "app_test"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    POSTGRES_PORT: "5432"
    DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/app_test"

    # CI-only application configuration.
    SECRET_KEY: "ci-only-secret-key"
    PROJECT_NAME: "FastAPI CI Test"
    FIRST_SUPERUSER: "admin@example.com"
    FIRST_SUPERUSER_PASSWORD: "ci-only-superuser-password"
    EMAIL_TEST_USER: "test@example.com"
    FASTAPI_ENV: "development"

phases:
  install:
    commands:
      - set -euo pipefail
      - echo "Installing uv and Python 3.14..."
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="${HOME}/.local/bin:${PATH}"
      - uv python install 3.14
      - uv sync --frozen --group dev

  pre_build:
    commands:
      - set -euo pipefail
      - export PATH="${HOME}/.local/bin:${PATH}"

      - echo "Validating build environment..."
      - command -v uv
      - command -v docker
      - command -v aws
      - test -f Dockerfile
      - test -d backend

      - echo "Starting PostgreSQL for the test suite..."
      - docker rm -f ci-postgres >/dev/null 2>&1 || true
      - docker run --rm --detach --name ci-postgres --publish 5432:5432 -e POSTGRES_USER="${POSTGRES_USER}" -e POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" public.ecr.aws/docker/library/postgres:17-alpine

      - echo "Waiting for PostgreSQL to become ready..."
      - |
        for i in $(seq 1 40); do
          if docker exec ci-postgres pg_isready -U "${POSTGRES_USER}" >/dev/null 2>&1; then
            echo "PostgreSQL is ready"
            break
          fi

          if [ "$i" -eq 40 ]; then
            echo "PostgreSQL did not become ready"
            docker logs ci-postgres
            exit 1
          fi

          sleep 2
        done

      - docker exec ci-postgres psql -U "${POSTGRES_USER}" -d postgres -c "DROP DATABASE IF EXISTS ${POSTGRES_DB};"
      - docker exec ci-postgres psql -U "${POSTGRES_USER}" -d postgres -c "CREATE DATABASE ${POSTGRES_DB};"

      - echo "Running database migrations and quality checks..."
      - cd backend
      - uv run alembic upgrade head
      - uv run alembic current
      - uv run ruff check app tests
      - uv run mypy app
      - uv run pytest tests -v
      - cd ..

      - echo "Resolving AWS account and ECR repository..."
      - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}"

      - test -n "${AWS_ACCOUNT_ID}"
      - test -n "${ECR_URI}"

      - |
        if [ -z "${CODEBUILD_RESOLVED_SOURCE_VERSION:-}" ]; then
          echo "ERROR: CODEBUILD_RESOLVED_SOURCE_VERSION is not available."
          exit 1
        fi

      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      - echo "ECR_URI=${ECR_URI}"
      - echo "IMAGE_TAG=${IMAGE_TAG}"

      - echo "Authenticating with Amazon ECR..."
      - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}" | docker login --username AWS --password-stdin "${ECR_URI}"

  build:
    commands:
      - set -euo pipefail
      - export PATH="${HOME}/.local/bin:${PATH}"
      - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      - echo "Building immutable application image..."
      - export DOCKER_BUILDKIT=1
      - docker build --tag "${ECR_URI}:${IMAGE_TAG}" .

      - echo "Pushing immutable application image..."
      - docker push "${ECR_URI}:${IMAGE_TAG}"

      - echo "Immutable image pushed: ${ECR_URI}:${IMAGE_TAG}"

  post_build:
    commands:
      - set -euo pipefail
      - export AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
      - export ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}"
      - export IMAGE_TAG="${CODEBUILD_RESOLVED_SOURCE_VERSION}"

      - echo "Creating ECS deployment artifact..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "${CONTAINER_NAME}" "${ECR_URI}:${IMAGE_TAG}" > imagedefinitions.json

      - echo "Generated imagedefinitions.json:"
      - cat imagedefinitions.json

      - echo "Cleaning up CI PostgreSQL..."
      - docker rm --force ci-postgres >/dev/null 2>&1 || true

      - echo "CI and immutable deployment artifact completed successfully."

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes

cache:
  paths:
    - "/root/.cache/uv/**/*"