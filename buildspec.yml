version: 0.2

env:
  variables:
    ECR_REPOSITORY: "aws-enterprise-cicd-app"
    CONTAINER_NAME: "aws-enterprise-cicd-app"
    POSTGRES_DB: "app_test"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"
    POSTGRES_PORT: "5432"
    DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/app_test"
    SECRET_KEY: "ci-only-secret-key"
    PROJECT_NAME: "FastAPI CI Test"
    FIRST_SUPERUSER: "admin@example.com"
    FIRST_SUPERUSER_PASSWORD: "ci-only-superuser-password"
    EMAIL_TEST_USER: "test@example.com"
    FASTAPI_ENV: "development"

phases:
  install:
    commands:
      - echo "Installing uv and Python 3.14..."
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="${HOME}/.local/bin:${PATH}"
      - uv python install 3.14
      - uv sync --frozen --group dev

  pre_build:
    commands:
      - echo "Starting PostgreSQL for the test suite..."
      - docker rm -f ci-postgres 2>/dev/null || true
      - docker run --rm --detach --name ci-postgres --publish 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres public.ecr.aws/docker/library/postgres:17-alpine
      - echo "Waiting for PostgreSQL to become ready..."
      - |
        for i in $(seq 1 40); do
          if docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; then
            echo "PostgreSQL is ready"
            break
          fi
          if [ $i -eq 40 ]; then
            echo "PostgreSQL did not become ready"
            docker logs ci-postgres
            exit 1
          fi
          sleep 2
        done
      - echo "Force creating test database..."
      - docker exec ci-postgres psql -U postgres -d postgres -c "DROP DATABASE IF EXISTS app_test;"
      - docker exec ci-postgres psql -U postgres -d postgres -c "CREATE DATABASE app_test;"
      - echo "Verifying test database..."
      - docker exec ci-postgres psql -U postgres -d app_test -c "SELECT current_database();"
      - echo "DATABASE_URL is ${DATABASE_URL}"
      - cd backend
      - echo "Running Alembic migrations..."
      - uv run alembic upgrade head
      - echo "Checking Alembic migration state..."
      - uv run alembic current
      - echo "Running Ruff..."
      - uv run ruff check app tests
      - echo "Running mypy..."
      - uv run mypy app
      - echo "Running pytest..."
      - uv run pytest tests -v
      - cd ..
      - echo "Logging in to Amazon ECR..."
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - export ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPOSITORY}
      - export IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-$(date +%Y%m%d%H%M%S)}
      - echo "ECR_URI=${ECR_URI}"
      - echo "IMAGE_TAG=${IMAGE_TAG}"
      - test -n "${IMAGE_TAG}"
      - test -n "${ECR_URI}"
      - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${ECR_URI}

  build:
    commands:
      - echo "Building the FastAPI full-stack Docker image..."
      - export DOCKER_BUILDKIT=1
      - echo "Using ECR_URI=${ECR_URI} IMAGE_TAG=${IMAGE_TAG}"
      - docker build --tag ${ECR_URI}:${IMAGE_TAG} --tag ${ECR_URI}:latest .

  post_build:
    commands:
      - echo "Stopping the PostgreSQL test container..."
      - docker rm --force ci-postgres >/dev/null 2>&1 || true
      - echo "Pushing the immutable application image..."
      - docker push ${ECR_URI}:${IMAGE_TAG}
      - echo "Updating the bootstrap latest image..."
      - docker push ${ECR_URI}:latest
      - echo "Generating the ECS deployment artifact..."
      - printf '[{"name":"%s","imageUri":"%s"}]' ${CONTAINER_NAME} ${ECR_URI}:${IMAGE_TAG} > imagedefinitions.json
      - echo "FastAPI CI and deployment artifact completed successfully."

artifacts:
  files:
    - imagedefinitions.json
  discard-paths: yes

cache:
  paths:
    - "/root/.cache/uv/**/*"

